<svg xmlns="http://www.w3.org/2000/svg" width="440" height="190" viewBox="0 0 440 190" fill="none">
  <defs>
    <linearGradient id="bg_co" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>
    <linearGradient id="border_co" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <style>
    .f-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .f-mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, monospace; }
  </style>

  <rect x="1.5" y="1.5" width="437" height="187" rx="12" fill="url(#bg_co)"/>
  <rect x="1.5" y="1.5" width="437" height="187" rx="12" fill="none" stroke="url(#border_co)" stroke-width="1.2"/>

  <!-- Top bar -->
  <g transform="translate(20, 20)">
    <circle cx="5" cy="5" r="4" fill="#38bdf8"/>
    <text x="16" y="9" fill="#38bdf8" font-size="10.5" font-weight="700" class="f-mono" letter-spacing="0.5">DEPLOYMENT PLATFORM</text>
    <text x="400" y="9" fill="#64748b" font-size="10.5" font-weight="500" class="f-mono" text-anchor="end">AWS · DOCKER</text>
  </g>

  <!-- Title & Descriptions -->
  <g transform="translate(20, 58)">
    <text x="0" y="0" fill="#f8fafc" font-size="20" font-weight="700" class="f-sans">CloudOps</text>
    <text x="0" y="24" fill="#94a3b8" font-size="12" font-weight="400" class="f-sans">
      Clones repos, builds Docker images, auto-provisions AWS EC2 instances.
    </text>
    <text x="0" y="44" fill="#64748b" font-size="11.5" font-weight="500" class="f-mono">
      ⚡ Node child-proc log stream via Socket.IO · HMAC-SHA256 redeploys
    </text>
  </g>

  <!-- Tech tags -->
  <g transform="translate(20, 142)">
    <rect x="0" y="0" width="56" height="22" rx="4" fill="#0f172a" stroke="#1e293b"/>
    <text x="28" y="15" fill="#cbd5e1" font-size="10.5" font-weight="500" class="f-sans" text-anchor="middle">React</text>

    <rect x="64" y="0" width="80" height="22" rx="4" fill="#0f172a" stroke="#1e293b"/>
    <text x="104" y="15" fill="#cbd5e1" font-size="10.5" font-weight="500" class="f-sans" text-anchor="middle">TypeScript</text>

    <rect x="152" y="0" width="65" height="22" rx="4" fill="#0f172a" stroke="#1e293b"/>
    <text x="184.5" y="15" fill="#cbd5e1" font-size="10.5" font-weight="500" class="f-sans" text-anchor="middle">Node.js</text>

    <rect x="225" y="0" width="58" height="22" rx="4" fill="#0f172a" stroke="#1e293b"/>
    <text x="254" y="15" fill="#cbd5e1" font-size="10.5" font-weight="500" class="f-sans" text-anchor="middle">Docker</text>

    <rect x="291" y="0" width="46" height="22" rx="4" fill="#0f172a" stroke="#1e293b"/>
    <text x="314" y="15" fill="#cbd5e1" font-size="10.5" font-weight="500" class="f-sans" text-anchor="middle">AWS</text>

    <rect x="345" y="0" width="55" height="22" rx="4" fill="#0f172a" stroke="#1e293b"/>
    <text x="372.5" y="15" fill="#38bdf8" font-size="10" font-weight="600" class="f-mono" text-anchor="middle">GitHub ↗</text>
  </g>
</svg>