<svg xmlns="http://www.w3.org/2000/svg" width="440" height="190" viewBox="0 0 440 190" fill="none">
  <defs>
    <linearGradient id="bg_ib" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191307"/>
      <stop offset="100%" stop-color="#0e0a03"/>
    </linearGradient>
    <linearGradient id="border_ib" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <style>
    .f-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .f-mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, monospace; }
  </style>

  <rect x="1.5" y="1.5" width="437" height="187" rx="12" fill="url(#bg_ib)"/>
  <rect x="1.5" y="1.5" width="437" height="187" rx="12" fill="none" stroke="url(#border_ib)" stroke-width="1.2"/>

  <!-- Top bar -->
  <g transform="translate(20, 20)">
    <circle cx="5" cy="5" r="4" fill="#f59e0b"/>
    <text x="16" y="9" fill="#f59e0b" font-size="10.5" font-weight="700" class="f-mono" letter-spacing="0.5">WEB DEVELOPMENT INTERN</text>
    <text x="400" y="9" fill="#64748b" font-size="10.5" font-weight="500" class="f-mono" text-anchor="end">10+ NGO CLIENTS</text>
  </g>

  <!-- Title & Descriptions -->
  <g transform="translate(20, 58)">
    <text x="0" y="0" fill="#f8fafc" font-size="20" font-weight="700" class="f-sans">ImpactBridge</text>
    <text x="0" y="24" fill="#94a3b8" font-size="12" font-weight="400" class="f-sans">
      Backend services for NGO onboarding, donations, and events.
    </text>
    <text x="0" y="44" fill="#cbd5e1" font-size="11" font-weight="500" class="f-sans">
      ⚡ <tspan fill="#f59e0b">Write-Behind Pipeline:</tspan> In-memory buffer · JWT auth &amp; rate limits
    </text>
  </g>

  <!-- Tech tags -->
  <g transform="translate(20, 142)">
    <rect x="0" y="0" width="65" height="22" rx="4" fill="#0f172a" stroke="#1e293b"/>
    <text x="32.5" y="15" fill="#cbd5e1" font-size="10.5" font-weight="500" class="f-sans" text-anchor="middle">Node.js</text>

    <rect x="73" y="0" width="65" height="22" rx="4" fill="#0f172a" stroke="#1e293b"/>
    <text x="105.5" y="15" fill="#cbd5e1" font-size="10.5" font-weight="500" class="f-sans" text-anchor="middle">Express</text>

    <rect x="146" y="0" width="76" height="22" rx="4" fill="#0f172a" stroke="#1e293b"/>
    <text x="184" y="15" fill="#cbd5e1" font-size="10.5" font-weight="500" class="f-sans" text-anchor="middle">REST APIs</text>

    <rect x="230" y="0" width="88" height="22" rx="4" fill="#0f172a" stroke="#1e293b"/>
    <text x="274" y="15" fill="#cbd5e1" font-size="10.5" font-weight="500" class="f-sans" text-anchor="middle">Google APIs</text>

    <rect x="326" y="0" width="74" height="22" rx="4" fill="#0f172a" stroke="#1e293b"/>
    <text x="363" y="15" fill="#f59e0b" font-size="10" font-weight="600" class="f-mono" text-anchor="middle">Internship</text>
  </g>
</svg>