<svg xmlns="http://www.w3.org/2000/svg" width="900" height="150" viewBox="0 0 900 150" fill="none">
  <defs>
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>
    <linearGradient id="pipeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="25%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="75%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <style>
    .p-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif; }
    .p-mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, Consolas, monospace; }
  </style>

  <!-- Background -->
  <rect x="2" y="2" width="896" height="146" rx="14" fill="url(#pipeBg)"/>
  <rect x="2" y="2" width="896" height="146" rx="14" fill="none" stroke="url(#pipeBorder)" stroke-width="1.5"/>

  <!-- Connecting Bus Line -->
  <path d="M 90 55 H 810" stroke="#1e293b" stroke-width="2"/>
  <path d="M 90 55 H 810" stroke="url(#lineGrad)" stroke-width="2" stroke-dasharray="8 8" opacity="0.8">
    <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.2s" repeatCount="indefinite"/>
  </path>

  <!-- Return Loop Track -->
  <path d="M 810 55 C 850 55, 850 22, 810 22 H 90 C 50 22, 50 55, 90 55" fill="none" stroke="#1e293b" stroke-width="1.2" stroke-dasharray="3 6"/>
  <text x="450" y="18" fill="#64748b" font-size="10.5" font-weight="600" class="p-mono" text-anchor="middle" letter-spacing="1">CONTINUOUS FEEDBACK &amp; DEPLOYMENT LOOP</text>

  <!-- Node 1: Learn -->
  <g transform="translate(90, 55)">
    <circle r="14" fill="#0b1329" stroke="#38bdf8" stroke-width="2"/>
    <circle r="5" fill="#38bdf8"/>
    <text y="42" fill="#f8fafc" font-size="13" font-weight="700" class="p-sans" text-anchor="middle">LEARN</text>
    <text y="58" fill="#94a3b8" font-size="10.5" font-weight="500" class="p-sans" text-anchor="middle">Deep Dive &amp; Specs</text>
  </g>

  <!-- Node 2: Build -->
  <g transform="translate(270, 55)">
    <circle r="14" fill="#0b1329" stroke="#818cf8" stroke-width="2"/>
    <circle r="5" fill="#818cf8"/>
    <text y="42" fill="#f8fafc" font-size="13" font-weight="700" class="p-sans" text-anchor="middle">BUILD</text>
    <text y="58" fill="#94a3b8" font-size="10.5" font-weight="500" class="p-sans" text-anchor="middle">Clean APIs &amp; UIs</text>
  </g>

  <!-- Node 3: Break -->
  <g transform="translate(450, 55)">
    <circle r="14" fill="#0b1329" stroke="#f59e0b" stroke-width="2"/>
    <circle r="5" fill="#f59e0b"/>
    <text y="42" fill="#f8fafc" font-size="13" font-weight="700" class="p-sans" text-anchor="middle">STRESS-TEST</text>
    <text y="58" fill="#94a3b8" font-size="10.5" font-weight="500" class="p-sans" text-anchor="middle">Concurrency &amp; Edge Cases</text>
  </g>

  <!-- Node 4: Fix -->
  <g transform="translate(630, 55)">
    <circle r="14" fill="#0b1329" stroke="#ef4444" stroke-width="2"/>
    <circle r="5" fill="#ef4444"/>
    <text y="42" fill="#f8fafc" font-size="13" font-weight="700" class="p-sans" text-anchor="middle">HARDEN</text>
    <text y="58" fill="#94a3b8" font-size="10.5" font-weight="500" class="p-sans" text-anchor="middle">Logs, Traces &amp; Latency</text>
  </g>

  <!-- Node 5: Ship -->
  <g transform="translate(810, 55)">
    <circle r="14" fill="#0b1329" stroke="#10b981" stroke-width="2"/>
    <circle r="5" fill="#10b981"/>
    <text y="42" fill="#f8fafc" font-size="13" font-weight="700" class="p-sans" text-anchor="middle">SHIP</text>
    <text y="58" fill="#94a3b8" font-size="10.5" font-weight="500" class="p-sans" text-anchor="middle">Dockerize &amp; Deploy</text>
  </g>

  <!-- Animated Traveling Packet -->
  <circle r="4" fill="#38bdf8">
    <animateMotion dur="5s" repeatCount="indefinite" path="M 90 55 H 810"/>
  </circle>
</svg>