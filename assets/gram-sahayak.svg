<svg xmlns="http://www.w3.org/2000/svg" width="440" height="190" viewBox="0 0 440 190" fill="none">
  <defs>
    <linearGradient id="bg_gs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091812"/>
      <stop offset="100%" stop-color="#060f0b"/>
    </linearGradient>
    <linearGradient id="border_gs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <style>
    .f-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .f-mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, monospace; }
  </style>

  <rect x="1.5" y="1.5" width="437" height="187" rx="12" fill="url(#bg_gs)"/>
  <rect x="1.5" y="1.5" width="437" height="187" rx="12" fill="none" stroke="url(#border_gs)" stroke-width="1.2"/>

  <!-- Top bar -->
  <g transform="translate(20, 20)">
    <circle cx="5" cy="5" r="4" fill="#34d399"/>
    <text x="16" y="9" fill="#34d399" font-size="10.5" font-weight="700" class="f-mono" letter-spacing="0.5">CIVIC INFRASTRUCTURE</text>
    <text x="400" y="9" fill="#64748b" font-size="10.5" font-weight="500" class="f-mono" text-anchor="end">GEO-VERIFIED</text>
  </g>

  <!-- Title & Descriptions -->
  <g transform="translate(20, 58)">
    <text x="0" y="0" fill="#f8fafc" font-size="20" font-weight="700" class="f-sans">Gram Sahayak</text>
    <text x="0" y="24" fill="#94a3b8" font-size="12" font-weight="400" class="f-sans">
      Civic grievance portal with automated contractor/official tracking.
    </text>
    <text x="0" y="44" fill="#64748b" font-size="11.5" font-weight="500" class="f-mono">
      ⚡ 50m Haversine anti-spoof · LLM sentiment triage · 14-day SLA
    </text>
  </g>

  <!-- Tech tags -->
  <g transform="translate(20, 142)">
    <rect x="0" y="0" width="62" height="22" rx="4" fill="#0f172a" stroke="#1e293b"/>
    <text x="31" y="15" fill="#cbd5e1" font-size="10.5" font-weight="500" class="f-sans" text-anchor="middle">FastAPI</text>

    <rect x="70" y="0" width="56" height="22" rx="4" fill="#0f172a" stroke="#1e293b"/>
    <text x="98" y="15" fill="#cbd5e1" font-size="10.5" font-weight="500" class="f-sans" text-anchor="middle">React</text>

    <rect x="134" y="0" width="72" height="22" rx="4" fill="#0f172a" stroke="#1e293b"/>
    <text x="170" y="15" fill="#cbd5e1" font-size="10.5" font-weight="500" class="f-sans" text-anchor="middle">MongoDB</text>

    <rect x="214" y="0" width="66" height="22" rx="4" fill="#0f172a" stroke="#1e293b"/>
    <text x="247" y="15" fill="#cbd5e1" font-size="10.5" font-weight="500" class="f-sans" text-anchor="middle">Leaflet</text>

    <rect x="288" y="0" width="50" height="22" rx="4" fill="#0f172a" stroke="#1e293b"/>
    <text x="313" y="15" fill="#cbd5e1" font-size="10.5" font-weight="500" class="f-sans" text-anchor="middle">LLMs</text>

    <rect x="345" y="0" width="55" height="22" rx="4" fill="#0f172a" stroke="#1e293b"/>
    <text x="372.5" y="15" fill="#34d399" font-size="10" font-weight="600" class="f-mono" text-anchor="middle">GitHub ↗</text>
  </g>
</svg>