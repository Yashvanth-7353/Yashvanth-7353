<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210" fill="none">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <linearGradient id="heroBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="85%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <radialGradient id="hGlowLeft" cx="12%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="hGlowRight" cx="88%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .f-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .f-mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, monospace; }
  </style>

  <!-- Container -->
  <rect x="1.5" y="1.5" width="897" height="207" rx="14" fill="url(#heroBg)"/>
  <rect x="1.5" y="1.5" width="897" height="207" rx="14" fill="url(#hGlowLeft)"/>
  <rect x="1.5" y="1.5" width="897" height="207" rx="14" fill="url(#hGlowRight)"/>
  <rect x="1.5" y="1.5" width="897" height="207" rx="14" fill="none" stroke="url(#heroBorder)" stroke-width="1.2"/>

  <!-- Top Status Bar -->
  <g transform="translate(36, 26)">
    <circle cx="5" cy="5" r="4" fill="#10b981"/>
    <text x="16" y="9" fill="#34d399" font-size="11" font-weight="700" class="f-mono" letter-spacing="0.5">OPEN TO SOFTWARE ENGINEERING &amp; CLOUD ROLES</text>
    <text x="828" y="9" fill="#94a3b8" font-size="11" font-weight="500" class="f-sans" text-anchor="end">📍 Bengaluru, India</text>
  </g>

  <!-- Name & Subtitle -->
  <g transform="translate(36, 62)">
    <text x="0" y="32" fill="url(#nameGrad)" font-size="34" font-weight="800" class="f-sans" letter-spacing="-0.5">Yashvanth M U</text>
    <text x="0" y="62" fill="#cbd5e1" font-size="15" font-weight="500" class="f-sans">
      Full-Stack Systems Engineer <tspan fill="#38bdf8">·</tspan> Cloud Architecture <tspan fill="#34d399">·</tspan> Applied AI
    </text>
    <text x="0" y="83" fill="#94a3b8" font-size="12.5" font-weight="400" class="f-sans">
      B.E. Information Science @ RV College of Engineering (8.77 CGPA) · Web Development Intern @ ImpactBridge
    </text>
  </g>

  <!-- Bottom Metric Pills -->
  <g transform="translate(36, 162)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="195" height="28" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="12" y="18" fill="#fbbf24" font-size="11" font-weight="700" class="f-mono">TOP 5 FINALIST</text>
    <text x="104" y="18" fill="#94a3b8" font-size="11" font-weight="500" class="f-sans">Hackfest 60+ Teams</text>

    <!-- Pill 2 -->
    <rect x="210" y="0" width="195" height="28" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="222" y="18" fill="#34d399" font-size="11" font-weight="700" class="f-mono">GOLD MEDAL</text>
    <text x="296" y="18" fill="#94a3b8" font-size="11" font-weight="500" class="f-sans">NPTEL Top 5% (91%)</text>

    <!-- Pill 3 -->
    <rect x="420" y="0" width="185" height="28" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="432" y="18" fill="#a78bfa" font-size="11" font-weight="700" class="f-mono">200+ SOLVED</text>
    <text x="512" y="18" fill="#94a3b8" font-size="11" font-weight="500" class="f-sans">LeetCode DSA</text>

    <!-- Pill 4 -->
    <rect x="620" y="0" width="208" height="28" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="632" y="18" fill="#38bdf8" font-size="11" font-weight="700" class="f-mono">&lt;200ms LATENCY</text>
    <text x="734" y="18" fill="#94a3b8" font-size="11" font-weight="500" class="f-sans">FAISS Vector Search</text>
  </g>
</svg>