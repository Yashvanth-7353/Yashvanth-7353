<svg xmlns="http://www.w3.org/2000/svg" width="900" height="150" viewBox="0 0 900 150" fill="none">
  <defs>
    <linearGradient id="metricBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </linearGradient>

    <linearGradient id="metricBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="glowMetric" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0a0e1a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .m-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .m-mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, monospace; }
  </style>

  <!-- Background Card -->
  <rect x="1.5" y="1.5" width="897" height="147" rx="14" fill="url(#metricBg)"/>
  <rect x="1.5" y="1.5" width="897" height="147" rx="14" fill="none" stroke="url(#metricBorder)" stroke-width="1.2"/>

  <!-- Vertical Divider Lines -->
  <line x1="225" y1="20" x2="225" y2="130" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="450" y1="20" x2="450" y2="130" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="675" y1="20" x2="675" y2="130" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Metric 1: Vector Search -->
  <g transform="translate(24, 28)">
    <text x="0" y="0" fill="#a78bfa" font-size="10.5" font-weight="700" class="m-mono" letter-spacing="0.5">VECTOR SEARCH LATENCY</text>
    <text x="0" y="36" fill="#f8fafc" font-size="28" font-weight="800" class="m-sans">&lt;200ms</text>
    <text x="0" y="58" fill="#94a3b8" font-size="11.5" font-weight="500" class="m-sans">384-d dense embeddings</text>
    <text x="0" y="74" fill="#64748b" font-size="11" font-weight="400" class="m-sans">FAISS similarity matching</text>
  </g>

  <!-- Metric 2: Geospatial Security -->
  <g transform="translate(248, 28)">
    <text x="0" y="0" fill="#34d399" font-size="10.5" font-weight="700" class="m-mono" letter-spacing="0.5">GEO-FENCE BOUNDARY</text>
    <text x="0" y="36" fill="#f8fafc" font-size="28" font-weight="800" class="m-sans">50 Meters</text>
    <text x="0" y="58" fill="#94a3b8" font-size="11.5" font-weight="500" class="m-sans">Spherical Haversine math</text>
    <text x="0" y="74" fill="#64748b" font-size="11" font-weight="400" class="m-sans">Zero GPS-spoofed reports</text>
  </g>

  <!-- Metric 3: Real-Time DevOps -->
  <g transform="translate(474, 28)">
    <text x="0" y="0" fill="#38bdf8" font-size="10.5" font-weight="700" class="m-mono" letter-spacing="0.5">LOG STREAMING</text>
    <text x="0" y="36" fill="#f8fafc" font-size="28" font-weight="800" class="m-sans">Real-Time</text>
    <text x="0" y="58" fill="#94a3b8" font-size="11.5" font-weight="500" class="m-sans">Child proc stdout pipes</text>
    <text x="0" y="74" fill="#64748b" font-size="11" font-weight="400" class="m-sans">Socket.IO + AWS EC2 / ECR</text>
  </g>

  <!-- Metric 4: Datastore Efficiency -->
  <g transform="translate(698, 28)">
    <text x="0" y="0" fill="#fbbf24" font-size="10.5" font-weight="700" class="m-mono" letter-spacing="0.5">WRITE-BEHIND CACHE</text>
    <text x="0" y="36" fill="#f8fafc" font-size="28" font-weight="800" class="m-sans">Batched</text>
    <text x="0" y="58" fill="#94a3b8" font-size="11.5" font-weight="500" class="m-sans">In-memory threshold buffer</text>
    <text x="0" y="74" fill="#64748b" font-size="11" font-weight="400" class="m-sans">Zero I/O bottleneck for 10+ NGOs</text>
  </g>
</svg>
