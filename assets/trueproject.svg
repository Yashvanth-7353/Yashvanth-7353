<svg xmlns="http://www.w3.org/2000/svg" width="440" height="190" viewBox="0 0 440 190" fill="none">
  <defs>
    <linearGradient id="bg_tp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140e24"/>
      <stop offset="100%" stop-color="#08060f"/>
    </linearGradient>
    <linearGradient id="border_tp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <style>
    .f-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .f-mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, monospace; }
  </style>

  <rect x="1.5" y="1.5" width="437" height="187" rx="12" fill="url(#bg_tp)"/>
  <rect x="1.5" y="1.5" width="437" height="187" rx="12" fill="none" stroke="url(#border_tp)" stroke-width="1.2"/>

  <!-- Top bar -->
  <g transform="translate(20, 20)">
    <circle cx="5" cy="5" r="4" fill="#a855f7"/>
    <text x="16" y="9" fill="#a855f7" font-size="10.5" font-weight="700" class="f-mono" letter-spacing="0.5">ACADEMIC WORKSPACE</text>
    <text x="400" y="9" fill="#64748b" font-size="10.5" font-weight="500" class="f-mono" text-anchor="end">&lt;200ms FAISS</text>
  </g>

  <!-- Title & Descriptions -->
  <g transform="translate(20, 58)">
    <text x="0" y="0" fill="#f8fafc" font-size="20" font-weight="700" class="f-sans">trueProject</text>
    <text x="0" y="24" fill="#94a3b8" font-size="12" font-weight="400" class="f-sans">
      Academic project portal with semantic evaluation and duplicate detection.
    </text>
    <text x="0" y="44" fill="#64748b" font-size="11.5" font-weight="500" class="f-mono">
      ⚡ 384-d dense embeddings · FAISS vector DB · Fact-grounded LLM
    </text>
  </g>

  <!-- Tech tags -->
  <g transform="translate(20, 142)">
    <rect x="0" y="0" width="62" height="22" rx="4" fill="#0f172a" stroke="#1e293b"/>
    <text x="31" y="15" fill="#cbd5e1" font-size="10.5" font-weight="500" class="f-sans" text-anchor="middle">FastAPI</text>

    <rect x="70" y="0" width="56" height="22" rx="4" fill="#0f172a" stroke="#1e293b"/>
    <text x="98" y="15" fill="#cbd5e1" font-size="10.5" font-weight="500" class="f-sans" text-anchor="middle">React</text>

    <rect x="134" y="0" width="56" height="22" rx="4" fill="#0f172a" stroke="#1e293b"/>
    <text x="162" y="15" fill="#cbd5e1" font-size="10.5" font-weight="500" class="f-sans" text-anchor="middle">FAISS</text>

    <rect x="198" y="0" width="82" height="22" rx="4" fill="#0f172a" stroke="#1e293b"/>
    <text x="239" y="15" fill="#cbd5e1" font-size="10.5" font-weight="500" class="f-sans" text-anchor="middle">PostgreSQL</text>

    <rect x="288" y="0" width="50" height="22" rx="4" fill="#0f172a" stroke="#1e293b"/>
    <text x="313" y="15" fill="#cbd5e1" font-size="10.5" font-weight="500" class="f-sans" text-anchor="middle">LLMs</text>

    <rect x="345" y="0" width="55" height="22" rx="4" fill="#0f172a" stroke="#1e293b"/>
    <text x="372.5" y="15" fill="#a855f7" font-size="10" font-weight="600" class="f-mono" text-anchor="middle">GitHub ↗</text>
  </g>
</svg>